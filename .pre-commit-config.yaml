# Fast, non-mutating local tripwire matching the CI gates (tests.yml,
# secrets-scanner.yml). Install once with `pre-commit install`; the gitleaks
# hook needs gitleaks on PATH (`brew install gitleaks`).
minimum_pre_commit_version: "3.5.0"
default_install_hook_types: [pre-commit]

repos:
  # Generic hygiene and syntax validation.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        name: Block files larger than 5 MB
        args: ["--maxkb=5120"]
      - id: detect-private-key
        name: Detect private keys
      - id: check-yaml
        name: Validate YAML syntax
      - id: check-toml
        name: Validate TOML syntax
      - id: check-merge-conflict
        name: Check for merge conflict markers
      - id: end-of-file-fixer
        name: Fix missing end-of-file newline
      - id: trailing-whitespace
        name: Trim trailing whitespace

  # The same lint gate CI runs, at the same pinned version.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        name: Ruff lint
        args: ["--output-format=concise"]
      - id: ruff-format
        name: Ruff format

  - repo: local
    hooks:
      # The mutation gate holds a deliberately introduced defect in a real file
      # under src/ for the length of a suite run, and from outside that process it
      # looks like an ordinary edit: a reader staged one and nearly committed it
      # (#268). The gate's own recovery record is the signal, and this is the only
      # reader of it that sits in front of a commit. Untracked, so pre-commit's
      # stash of unstaged tracked changes leaves it in place for the check.
      #
      # First in this file's local hooks on purpose: there is nothing worth
      # scanning in a tree whose contents are not what they say.
      - id: mutation-gate-live
        name: Refuse a commit while a mutation is applied
        entry: python3 tests/mutation_gate.py --status
        language: system
        pass_filenames: false

      # Secret detection, matching the CI secrets scanner.
      - id: gitleaks
        name: Detect secrets (gitleaks)
        entry: gitleaks git --pre-commit --redact --staged
        language: system
        pass_filenames: false
