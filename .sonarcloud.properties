# Read by SonarCloud's automatic analysis (sonar-project.properties is not).
#
# The MCP server's test stores and its synthetic fixture store are this
# library's own generated output, committed so the server's tests can read it:
# the explorer page and the near-identical store/ and no-index/ copies would
# otherwise be scored as code written here.
sonar.exclusions=tests/server/library_store/**,tests/server/fixture_store/**
sonar.cpd.exclusions=tests/server/library_store/**,tests/server/fixture_store/**

# Actions float on their major tag by policy (see .github/codeql/codeql-config.yml),
# accepting that a tag can be moved; S7637 asks for a commit SHA on every
# third-party action, so it would fire on each one by that policy.
sonar.issue.ignore.multicriteria=actiontags
sonar.issue.ignore.multicriteria.actiontags.ruleKey=githubactions:S7637
sonar.issue.ignore.multicriteria.actiontags.resourceKey=.github/workflows/**
