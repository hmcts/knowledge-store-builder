[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "hmcts-knowledge-store-builder"
# The version is the git tag (hatch-vcs): creating a GitHub release IS the
# version bump. Untagged commits build as <next>.devN+g<sha> automatically.
dynamic = ["version"]
description = "Build a committed, queryable knowledge store from a fleet of git repositories"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "HM Courts & Tribunals Service" }]
keywords = ["knowledge-graph", "graphrag", "code-analysis", "documentation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Documentation",
]
# The core pipeline is standard library only, by design: it runs anywhere
# Python does, with no supply chain to review.
dependencies = []

[project.optional-dependencies]
# Only the semantic index needs a model. Everything else works without it.
semantic = ["fastembed>=0.4", "numpy>=1.24"]
# Only the deployments stage parses YAML. It stays optional so the default
# install keeps its empty runtime dependency list.
deploy = ["PyYAML>=6"]
# Only the convert stage reads Office formats. Optional because an estate with
# no Office documents should not carry the dependency, and one with them should
# make the choice deliberately.
documents = ["markitdown>=0.0.1"]
# Only the extract-ast stage drives a source parser. Optional because a store
# that already produces its own AST layer should not carry a parser it never
# calls, and because extraction is the one part of this pipeline that is not
# standard library by nature.
ast = ["graphifyy>=0.1"]
# Lint, format and type-check tooling, pinned to what CI runs.
dev = ["ruff==0.16.5", "pyright==1.1.411"]

[project.scripts]
knowledgestore = "knowledgestore.cli:main"

[project.urls]
Homepage = "https://github.com/hmcts/knowledge-store-builder"
Source = "https://github.com/hmcts/knowledge-store-builder"

[tool.hatch.version]
source = "vcs"
# Local/source builds version as <next>.devN+g<sha> (node-and-date, the
# upstream default, pinned to be visible). PUBLISHED drafts instead carry the
# bare 7-char GitHub short SHA — see the override in .github/workflows/build.yml.
# Tagged (release) builds are the bare tag everywhere.
raw-options = { local_scheme = "node-and-date" }

[tool.hatch.build.targets.wheel]
# assets/app.js sits inside the package, so it is included automatically
packages = ["src/knowledgestore"]

[tool.hatch.build.targets.sdist]
include = ["src/knowledgestore", "tests", "examples", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.pytest.ini_options]
# Test the working tree, never a copy of this package installed in the
# environment. Without this, `pytest` on a machine holding a non-editable
# install of the released library imports site-packages instead of src/: the
# suite passes without running any of your changes. CI installs with -e, so it
# never sees this, which is what makes it easy to miss.
pythonpath = ["src"]

[tool.pyright]
# `src`, plus the docs-integrity gate by name. Not `tests/` wholesale: that
# would surface errors across every test module at once, which is a repo-wide
# decision and not one to take alongside a new gate. Named narrowly instead,
# because a gate CI never type-checks is the shape of problem this one exists
# to prevent - a check reporting green about a file it never read.
include = ["src", "tests/docs_integrity.py", "tests/test_docs_integrity.py"]
# Stage modules read module-level path constants that tests and configure()
# rebind, so inferred types are deliberately loose in places.
typeCheckingMode = "basic"
pythonVersion = "3.10"
reportMissingImports = "warning"
