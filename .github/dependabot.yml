version: 2

updates:
  # ===================
  # Python (pip / uv)
  # ===================
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "main"
    open-pull-requests-limit: 10
    groups:
      python-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # The lock file records the optional extras too, including the `server` extra's
  # exact `mcp` pin, so Dependabot reads it as a uv project as well.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "main"
    open-pull-requests-limit: 10
    groups:
      uv-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ===================
  # GitHub Actions
  # ===================
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "main"
    open-pull-requests-limit: 10
    groups:
      github-actions-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
