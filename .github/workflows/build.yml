name: Build

# Validates the package builds on every PR, and publishes the wheel/sdist to the
# shared HMCTS Azure DevOps Artifacts feed (hmcts-lib) — the same feed the Java
# libraries publish to.
#
# The version is derived from the git tag by hatch-vcs — creating a GitHub
# release IS the version bump; nothing in the source mentions a version:
#
#   push to main        -> <last-tag>.devN+<short-sha>  (draft; bare GitHub short SHA)
#   published release   -> the tag, verbatim  (v0.4.0 -> 0.4.0)
#
# Auth is basic auth to Azure Artifacts using the org secrets
# AZURE_DEVOPS_ARTIFACT_USERNAME / AZURE_DEVOPS_ARTIFACT_TOKEN (same as Gradle).

on:
  pull_request:
    branches: [main]
    # Skip docs/config-only changes — packaging is unaffected.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.claude/**'
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # hatch-vcs derives the version from tags

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Build package
        run: uv build

      - name: Check package metadata (twine)
        run: uvx twine check dist/*

      - name: Upload build artefacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to Azure Artifacts (hmcts-lib)
    needs: [build]
    if: github.event_name == 'push' || github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # hatch-vcs derives the version from tags

      # Before anything is built or uploaded, and only on a release: the plugin
      # manifest's version and the build skill's library floor are written by hand
      # and derived from nothing, so a release can publish numbers that disagree
      # with its own tag. The comparison lives here rather than in the unit suite
      # because its input is the tag: as a test it made the same `main` commit pass
      # before a release and fail after it. The tag already exists when this runs,
      # so it prevents the publish, not the tag.
      - name: Check the plugin manifest and skill floor against the tag
        if: github.event_name == 'release'
        run: python3 scripts/check_release_versions.py

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Build at the tag-derived version
        run: |
          # Drafts carry the bare 7-char GitHub short SHA (0.3.1.dev9+b83e13d).
          # setuptools-scm's own local schemes only offer git-describe form
          # (+g<sha9>), so the draft version is computed here and injected via
          # the documented override; a release builds the checked-out tag as-is.
          if [ "${{ github.event_name }}" != "release" ]; then
            # Base = the LAST tag (0.3.0.devN), matching the artefact-version
            # form the feed has always carried. Duncan's explicit choice over
            # next-patch: continuity on the feed beats PEP 440 dev-sorts-before-
            # base ordering, since consumers pin exact versions anyway.
            LAST=$(git describe --tags --abbrev=0)
            DRAFT="${LAST#v}.dev$(git rev-list "${LAST}..HEAD" --count)+$(git rev-parse --short=7 HEAD)"
            export SETUPTOOLS_SCM_PRETEND_VERSION="$DRAFT"
          fi
          uv build
          echo "Publishing:" dist/*.whl

      - name: Publish to the hmcts-lib PyPI feed
        env:
          # Same Azure DevOps Artifacts feed + credentials as the Gradle publish.
          TWINE_USERNAME: ${{ secrets.AZURE_DEVOPS_ARTIFACT_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.AZURE_DEVOPS_ARTIFACT_TOKEN }}
          TWINE_REPOSITORY_URL: https://pkgs.dev.azure.com/hmcts/Artifacts/_packaging/hmcts-lib/pypi/upload/
        run: uvx twine upload --non-interactive dist/*
