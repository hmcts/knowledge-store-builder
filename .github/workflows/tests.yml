name: tests

on:
  pull_request:
  push:
    branches: [main]
  # The `mapping` job below runs only on these two, never on a pull request: it
  # applies every entry against the whole suite, which is the cost the mapping
  # exists to avoid paying per run.
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # hatch-vcs derives the version from tags at install

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Before the Python steps, not after: the answer gate's own test drives the
      # shipped runner through Node and fails rather than skips without it. Ordered
      # after the Python setup it would have failed the job on a runner without a
      # preinstalled node, for a reason nothing in the log would explain.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # No ruff here: `lint.yml` runs `ruff check src tests` on the same pinned
      # 0.16.0, so this was the identical command twice per pull request - and two
      # places to remember when the paths change, which is how a directory outside
      # `src/` came to be linted by neither for a while. `lint.yml` is skipped by
      # paths-ignore only for changes that carry no Python, so nothing loses
      # coverage.

      - name: Install the package
        run: pip install -e .

      # The default install declares no runtime dependencies, and this run proves
      # it: every test that needs an optional extra skips rather than fails, so a
      # dependency creeping into the core surfaces here as a failure.
      - name: Unit tests, default install
        run: python3 -m unittest discover -s tests -v

      # Pinned rather than resolved from the `deploy` extra's `>=6`, so CI installs
      # the same PyYAML every run and a new release cannot change what this job
      # proves. The extra itself stays a range, because that is what a consumer
      # installs; `test_the_deploy_extra_declares_pyyaml` keeps the two honest.
      #
      # A block scalar, because `--only-binary :all:` carries a colon-space that
      # YAML would otherwise read as a nested mapping.
      - name: Install the optional extras
        run: |
          pip install --only-binary :all: 'PyYAML==6.0.3'
          # graphify too, and not only for the deployments stage. Without it 20
          # tests skip silently - every check that reads graphify's own dispatch
          # table or its ignore helpers - so "with extras" was green over a fifth
          # of its own suite never running. Found by the mutation gate below,
          # which reported a symlink-exclusion mutation as surviving in CI while
          # the same mutation was caught locally.
          pip install --only-binary :all: 'graphifyy==0.9.45'

      # And again with the extras present, so the stages behind them are actually
      # exercised. Without this the deployments stage would be skipped in CI and
      # green would mean nothing about it.
      - name: Unit tests, with extras
        run: python3 -m unittest discover -s tests -v

      # A green suite reports two things with the same output: that the product
      # works, and that nothing is checking it. This gate distinguishes them by
      # breaking the product on purpose and requiring the suite to notice. Every
      # mutation in it is a defect that was actually written, reviewed and caught
      # late - one of them shipped in a release.
      #
      # Each entry names the test modules that observe it and only those are run,
      # which took this step from about 26 minutes to 81 seconds measured locally
      # over 183 entries. That makes each entry's mapping load-bearing and
      # invisible from a passing run: a wrong name prints `caught` either way,
      # once because the mutation was seen and once because a module that cannot
      # see it failed for its own reasons. Do not add an entry without running
      # `--derive-mapping` for it.
      #
      # `--verify-mapping` is the check for that. It applies every entry against
      # the whole suite and refuses a set that disagrees with what actually
      # failed, in both directions. That costs what this gate cost before the
      # mapping existed - 1683 seconds measured here - so it runs on the schedule
      # and on `workflow_dispatch`, in the `mapping` job below, over four runners
      # at a time (#285).
      #
      # A condition rather than a shell branch: interpolating an expression into
      # a `run:` block is the script-injection shape the analysers read, and it
      # is worth not writing even where the value is an enum the runner controls.
      - name: Mutation gate
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: python3 tests/mutation_gate.py

      # One script, run here and by contributors, so the pinned versions and the
      # checked paths cannot differ between the two.
      - name: Lint and type-check explorer JavaScript
        run: tests/explorer/check-js.sh

      - name: Explorer scorer unit tests
        run: node tests/explorer/engine-unit.mjs

      # Builds a page from a synthetic estate, then drives every composed
      # answer shape against it.
      - name: Explorer page regression
        run: |
          python3 tests/explorer/fixture.py
          node tests/explorer/page-regression.mjs

      # The answer gate, broken on purpose. Three successive versions of its
      # ticket predicate passed the good page and every assertion while failing to
      # notice a dead file-to-ticket join - the defect the gate exists for. Only
      # this catches that, and it caught it three times.
      - name: Answer gate mutations
        run: node tests/explorer/answer-regression-mutations.mjs

      # Last, so it judges everything above it. `git add -A` is banned in this
      # repository because the working tree collects generated output, another
      # session's edits and scratch at once - and that rule had no gate, so
      # nothing could notice a test writing into the checkout instead of a
      # temporary directory. The step does not stop anyone typing `git add -A`;
      # it removes the population of stray files that makes it dangerous.
      #
      # What it cannot see is a stray write to an already-ignored path, and both
      # of the two this repository had were exactly that: found by enumerating
      # the tree with `git status --ignored` while adding this step, hidden by a
      # gitignore entry that exists for an unrelated reason. This check would
      # have stayed green over either, which is why they were fixed at the test
      # instead of being written down here as expected output.
      #
      # It also makes the mutation gate's restore structural. That gate edits a
      # real source file and puts it back, and until now the only evidence the
      # restore was byte-exact was a hand-run `shasum` either side.
      #
      # Two commands, because they answer different questions - a tracked file
      # modified, and a file created - and the second is the strict one: it sees
      # both. `git diff --exit-code` runs first because it prints the change,
      # which a porcelain listing never does, so a failure says what moved.
      # Joined with `&&` so the step cannot pass on one while the other failed.
      - name: The suite left the checkout as it found it
        run: |
          git diff --exit-code \
            && test -z "$(git status --porcelain=v1 --untracked-files=all)" \
            || { git status --porcelain=v1 --untracked-files=all; exit 1; }

  # The same mapping check, in slices, because it applies every entry against the
  # whole suite: 1683 seconds in one job, and long enough that nobody dispatches
  # it on demand - which is exactly when a mapping claim most needs checking,
  # after a change that moved tests (#285).
  #
  # It shards cleanly because every entry runs the same thing, so entries are
  # interchangeable units of work with no ordering and no cross-entry state. One
  # runner per shard, so there is no shared filesystem and therefore no shared
  # subject: the gate mutates a real file in the tree, and two workers doing that
  # in one checkout corrupt each other's. That is also why the fast mode above is
  # not parallelised - half its 90 seconds is process-and-import floor, and its
  # entries are concentrated on a few modules.
  #
  # The steps up to the extras are the `tests` job's, step for step, and
  # `test_mutation_gate_shards` fails if they stop being: one runner per shard
  # costs a second job, and this is what keeps it from also costing a second
  # environment. A prefix rather than a hand-picked subset, because a prefix is
  # something a check can compare.
  mapping:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      # Every leg runs, so two disagreeing entries in different shards are two
      # findings rather than one and a cancellation.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # hatch-vcs derives the version from tags at install

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install the package
        run: pip install -e .

      - name: Unit tests, default install
        run: python3 -m unittest discover -s tests -v

      - name: Install the optional extras
        run: |
          pip install --only-binary :all: 'PyYAML==6.0.3'
          # graphify too, and not only for the deployments stage. Without it 20
          # tests skip silently - every check that reads graphify's own dispatch
          # table or its ignore helpers - so "with extras" was green over a fifth
          # of its own suite never running. Found by the mutation gate below,
          # which reported a symlink-exclusion mutation as surviving in CI while
          # the same mutation was caught locally.
          pip install --only-binary :all: 'graphifyy==0.9.45'

      # The divisor is the number of legs rather than a literal four, so adding
      # or removing one cannot leave a quarter of the table unchecked with every
      # leg green. The gate reconciles the slices against the table before it
      # applies anything, and refuses a set that is not a partition of it - but
      # it can only reconcile the slices of the count it is given, so nothing in
      # it could notice a matrix that ran three of four.
      #
      # Through the environment rather than interpolated into the script: that is
      # the script-injection shape the analysers read, and it is what makes the
      # verdict below runnable outside Actions.
      - name: Mutation gate, verifying this shard's entries against the whole suite
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        run: python3 tests/mutation_gate.py --verify-mapping --shard "$SHARD/$SHARDS"

  # One verdict over the legs. GitHub reports each of them as its own check, so a
  # reader gets four results and no answer, and a required context cannot be a
  # matrix leg.
  #
  # `always()` because a job that `needs` a failed one is skipped, and a skipped
  # check is not a failed one - a required context reads it as satisfied. Without
  # it this job would report nothing in exactly the case it exists for. The event
  # condition is repeated because `always()` would otherwise run it on a pull
  # request, where `mapping` was skipped and its result is neither pass nor fail.
  mapping-summary:
    needs: mapping
    if: >-
      always() && (github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Every shard's entries agree with what the suite observed
        env:
          RESULT: ${{ needs.mapping.result }}
        run: |
          test "$RESULT" = success || {
            echo "The sharded mapping check did not pass: $RESULT."
            echo "Each shard verifies its own slice of the table against a whole-suite"
            echo "run per entry, so the entries in a leg that did not pass are entries"
            echo "whose observers nothing has checked. Read the failing leg's log."
            exit 1
          }
