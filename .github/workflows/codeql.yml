name: CodeQL

on:
  # NO paths-ignore here, deliberately. `CodeQL` is a REQUIRED status check in
  # the main ruleset, and a workflow skipped by paths-ignore never reports its
  # check at all — so a docs-only pull request waits forever on a check that
  # will never arrive (this deadlocked a documentation PR until it was found).
  # The analyse job is cheap to skip internally: it is gated on repository
  # visibility below, and on a docs-only change CodeQL finds nothing anyway.
  # If the cost of running it on prose ever matters, the fix is a companion
  # job that reports the same `CodeQL` context for doc-only paths — not
  # paths-ignore on a required check.
  pull_request:
    branches:
      - main

  # Without a push trigger CodeQL never analyses the default branch, so the
  # Security tab holds no baseline and every pull request is compared against
  # nothing. GitHub reports that as a warning annotation on each run
  # ("Please specify an on.push hook..."), which is how this was noticed.
  push:
    branches:
      - main

  schedule:
    - cron: '36 5 * * 4'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # GitHub Advanced Security (code scanning) is disabled at org level for
    # private/internal repos, so CodeQL cannot upload results and would fail.
    # Gate on visibility: this job is SKIPPED while the repo is internal/private
    # and AUTO-ENABLES the moment the repo becomes public — no manual step.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # python: the pipeline. javascript: the explorer application, which
        # ships inside the wheel and runs in consumers' browsers.
        language: [python, javascript]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        # Details on CodeQL's query packs refer to : https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning#using-queries-in-ql-packs
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml

      # Both languages are interpreted; CodeQL needs no build step.
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
