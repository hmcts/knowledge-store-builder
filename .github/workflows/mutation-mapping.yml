name: mutation mapping

# Every entry in `tests/mutation_gate.py` names the test modules that observe it,
# and the `tests` job runs only those - 81 seconds for the table instead of about
# 26 minutes, measured locally over 183 entries. The
# claim each entry makes is therefore load-bearing and invisible from a passing
# run: a wrong observer prints `caught` exactly like a right one. This job is what
# checks it, by applying every entry against the whole suite and comparing the
# modules that failed with the modules the entry names.
#
# Not in `tests.yml`, and not a required check: it costs one full suite run per
# entry, which is the ~26 minutes the mapping exists to avoid paying per pull
# request. Weekly and on demand instead. Moving it to `on: push: branches: [main]`
# is a three-line change if attribution to a commit is worth that cost.
#
# A cron in a repository with no activity for 60 days is disabled by GitHub, which
# is silent - if this has not reported in a while, check that it is still enabled.

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: mutation-mapping-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mapping:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # hatch-vcs derives the version from tags at install

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the package
        run: pip install -e .

      # The same versions `tests.yml` pins, and for the same reason twice over
      # here: without them 20 tests skip, and a module whose tests skipped cannot
      # fail - so every entry those tests observe would be reported as naming a
      # module that did not fail. The mapping would read as wrong when it is the
      # environment that is incomplete.
      #
      # A block scalar, because `--only-binary :all:` carries a colon-space that
      # YAML would otherwise read as a nested mapping.
      - name: Install the optional extras
        run: |
          pip install --only-binary :all: 'PyYAML==6.0.3'
          pip install --only-binary :all: 'graphifyy==0.9.45'

      - name: Verify every entry's observers against the whole suite
        run: python3 tests/mutation_gate.py --verify-mapping
