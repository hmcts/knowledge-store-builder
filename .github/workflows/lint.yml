name: Lint

# Lint, format and type-check gate. All three are blocking: the library is
# ruff-formatted and pyright-clean, and staying that way is cheaper than
# recovering it later.

on:
  pull_request:
    branches: [main]
    # Skip docs/config-only changes — nothing to lint or type-check.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.claude/**'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Ruff + Pyright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      # --frozen installs exactly what uv.lock resolves, so the whole
      # dependency tree is locked, not just the versions we name.
      - name: Install the tooling
        run: uv sync --frozen --extra dev

      - name: Ruff lint
        run: uv run ruff check src tests --output-format=github

      - name: Ruff format check
        run: uv run ruff format --check src tests

      - name: Pyright
        run: uv run pyright
