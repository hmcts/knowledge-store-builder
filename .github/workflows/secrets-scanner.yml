name: Secrets Scanner
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 4 * * 4' # Every Thursday at 04:00
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: hmcts/secrets-scanner@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          gitleaks_license: ${{ secrets.GITLEAKS_LICENSE }}
          # TruffleHog's Lob detector matches a 40-character window of word
          # characters, not an identifier, so a descriptive test name like
          # `test_a_stack_frame_is_noise_whatever_its_package_root` reads to it as
          # a live API key - and it reports them as VERIFIED, which is what makes
          # them expensive to ignore. Scoped to test directories deliberately:
          # a real Lob credential committed to application code is still caught.
          trufflehog_exclude_detectors: lob
          trufflehog_exclude_detectors_in: |
            (^|/)tests?/

  pre-commit:
    name: pre-commit (secret guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.30.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Run pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure
