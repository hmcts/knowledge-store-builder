name: Secrets Scanner
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 4 * * 4' # Every Thursday at 04:00
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: hmcts/secrets-scanner@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          gitleaks_license: ${{ secrets.GITLEAKS_LICENSE }}
          # A Lob key is the literal "test_" followed by 35 more characters, and
          # the detector matches that as a 40-character window of text rather than
          # as an identifier. A descriptive test method name reaches 40 characters
          # easily, so it reads as a live key - and is reported VERIFIED, the one
          # signal people are told never to ignore. (Deliberately not quoting an
          # offending name here: writing one into this file makes this file a
          # finding, which is how the first attempt at this fix broke.)
          #
          # Scoped, not repository-wide: the plans directory is included because
          # it quotes test code, and history is scanned too (fetch-depth: 0), so
          # a name removed from a file is still found in the commit that had it.
          # Everywhere else is still scanned by every detector, so a real Lob
          # credential in application code is still caught.
          trufflehog_exclude_detectors: lob
          trufflehog_exclude_detectors_in: |
            (^|/)tests?/
            (^|/)docs/superpowers/plans/

  pre-commit:
    name: pre-commit (secret guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.30.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Run pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure
