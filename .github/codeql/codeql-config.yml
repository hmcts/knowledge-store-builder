name: "CodeQL config"
paths-ignore:
  - "**/tests/**"
  - ".fixture-store/**"
  - "**/__pycache__/**"
  - "dist/**"
  - "build/**"

# Actions float on their major tag (v7), so minor and patch releases arrive
# without a pull request; one that publishes no major tag is pinned to its exact
# release tag and Dependabot moves it. Never a commit SHA, so
# actions/unpinned-tag, which asks for one on every third-party action, would
# fire on each by policy.
query-filters:
  - exclude:
      id: actions/unpinned-tag
